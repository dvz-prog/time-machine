name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: |
          echo "Arquivos na raiz:"; ls -la
          F=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then echo "ERRO: settings.gradle.kts nao foi encontrado no repositorio"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Projeto em: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TimeMachine-apk
          path: '**/app-debug.apk'
